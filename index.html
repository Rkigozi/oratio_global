    <meta name="twitter:image" content="https://oratiotest.netlify.app/icons/og-image.png" />
    <title>Oratio - Global Prayer Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("oratio_theme");
          if (mode !== "system" && mode !== "light" && mode !== "dark") mode = "system";
          var systemLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = mode === "system" ? (systemLight ? "light" : "dark") : mode;
          var color = theme === "light" ? "#F0F3F9" : "#0A1A3A";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.setProperty("--oratio-page-bg", color);
          document.documentElement.style.backgroundColor = color;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", color);
        } catch (e) {
          document.documentElement.style.setProperty("--oratio-page-bg", "#0A1A3A");
        }
      })();
    </script>
    <style>
      /* CSS Reset for PWA/Mobile Height Fix */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Prevent body scrolling */
        background: var(--oratio-page-bg, #0A1A3A); /* Prevent white flash on iOS cold start */
      }
      
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh; /* Fallback */
        min-height: 100dvh; /* Dynamic viewport height */
      }
      
      /* Safe area insets handled in Header and BottomNav components */
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Last-resort safety net: if a load-time error fires before the React app
      // has mounted anything into #root, the user would otherwise be stuck on the
      // blue splash background forever. Replace it with a readable message and a
      // way to recover. Once the app mounts (#root has children) this stays out
      // of the way — runtime errors are handled by the in-app ErrorBoundary.
      (function () {
        var shown = false;
        function showFallback() {
          var root = document.getElementById("root");
          if (shown || !root || root.childElementCount > 0) return;
          shown = true;
          root.innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:16px;padding:24px;text-align:center;font-family:Inter,system-ui,sans-serif;color:#e6ecff">' +
            '<p style="font-size:15px;margin:0">We couldn\'t load the app</p>' +
            '<p style="font-size:13px;opacity:.7;margin:0;max-width:20rem">Something went wrong while starting up. Please reload to try again.</p>' +
            '<button style="padding:8px 20px;border-radius:9999px;font-size:13px;color:#7c8fff;background:transparent;border:1px solid rgba(124,143,255,.3);cursor:pointer" onclick="location.reload()">Reload</button>' +
            "</div>";
        }
        window.addEventListener("error", showFallback);
        window.addEventListener("unhandledrejection", showFallback);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
