    <script>
      (function () {
        try {
          var mode = localStorage.getItem("oratio_theme");
          if (mode !== "system" && mode !== "light" && mode !== "dark") mode = "system";
          var systemLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = mode === "system" ? (systemLight ? "light" : "dark") : mode;
          var color = theme === "light" ? "#F0F3F9" : "#0A1A3A";
          var safeAreaColor = theme === "light" ? "#FFFFFF" : "#0A1A3A";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.setProperty("--oratio-page-bg", color);
          document.documentElement.style.setProperty("--oratio-safe-area-bg", safeAreaColor);
          document.documentElement.style.backgroundColor = safeAreaColor;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", safeAreaColor);
        } catch (e) {
          document.documentElement.style.setProperty("--oratio-page-bg", "#0A1A3A");
          document.documentElement.style.setProperty("--oratio-safe-area-bg", "#0A1A3A");
        }
      })();
    </script>
    <script>
      // Install before Vite injects the production module script. If startup
      // fails, React cannot mount its own error boundary yet.
      (function () {
        var shown = false;
        var moduleScriptPatterns = [
          /importing a module script failed/i,
          /failed to fetch dynamically imported module/i,
          /error loading dynamically imported module/i,
          /module script load failed/i,
          /chunkloaderror/i,
          /loading chunk \d+ failed/i
        ];

        function errorText(error) {
          if (!error) return "";
          if (typeof error === "string") return error;
          if (error.message) return error.message;
          if (error.reason) return errorText(error.reason);
          if (error.error) return errorText(error.error);
          try {
            return String(error);
          } catch (e) {
            return "";
          }
        }

        function isStartupTimeout(error) {
          return /startup timeout/i.test(errorText(error));
        }

        function isRepairableStartupFailure(error) {
          return isModuleScriptError(error) || isStartupTimeout(error);
        }

        function isModuleScriptError(error) {
          var text = errorText(error);
          return moduleScriptPatterns.some(function (pattern) {
            return pattern.test(text);
          });
        }

        function recoverStartup() {
          var tasks = [];
          if ("serviceWorker" in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (registration) {
                  return registration.unregister();
                }));
              })
            );
          }
          if ("caches" in window) {
            tasks.push(
              window.caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) {
                  return window.caches.delete(key);
                }));
              })
            );
          }

          Promise.allSettled(tasks).finally(function () {
            window.location.reload();
          });
        }

        function renderFallback(event) {
          var root = document.getElementById("root");
          if (!root) {
            window.setTimeout(function () {
              renderFallback(event);
            }, 0);
            return;
          }
          if (shown || root.childElementCount > 0) return;
          shown = true;

          var isRepairable = isRepairableStartupFailure(event);
          var isTimedOut = isStartupTimeout(event);
          var isOffline = navigator.onLine === false;
          var title = isOffline
            ? "You're offline"
            : isRepairable
              ? "Oratio needs a refresh"
              : "We couldn't load the app";
          var detail = isOffline
            ? "Reconnect to the internet, then reload Oratio."
            : isTimedOut
              ? "The app took too long to start. This can happen when Safari has an older file cached or the connection drops."
              : isRepairable
                ? "The installed app has an older file cached. Repair and reload to open the latest version."
              : "Something went wrong while starting up. Please reload to try again.";
          var action = isRepairable && !isOffline ? "Repair and reload" : "Reload";
          var click = isRepairable && !isOffline
            ? "window.__oratioStartupRecover()"
            : "location.reload()";

          root.innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:16px;padding:24px;text-align:center;font-family:Inter,system-ui,sans-serif;color:#e6ecff">' +
            '<p style="font-size:15px;margin:0">' + title + '</p>' +
            '<p style="font-size:13px;opacity:.7;margin:0;max-width:20rem">' + detail + '</p>' +
            '<button style="padding:8px 20px;border-radius:9999px;font-size:13px;color:#7c8fff;background:transparent;border:1px solid rgba(124,143,255,.3);cursor:pointer" onclick="' + click + '">' + action + '</button>' +
            "</div>";
        }

        window.__oratioStartupRecover = recoverStartup;
        window.addEventListener("error", renderFallback);
        window.addEventListener("unhandledrejection", renderFallback);
        window.setTimeout(function () {
          renderFallback("startup timeout");
        }, 10000);
      })();
    </script>
    <style>
      /* CSS Reset for PWA/Mobile Height Fix */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Prevent body scrolling */
        background: var(--oratio-safe-area-bg, var(--oratio-page-bg, #0A1A3A)); /* Prevent mismatched iOS safe-area flashes */
      }
      
      #root {
        width: 100%;
        height: 100%;
        min-height: 100vh; /* Fallback */
        min-height: 100dvh; /* Dynamic viewport height */
      }
      
      /* Safe area insets handled in Header and BottomNav components */
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
