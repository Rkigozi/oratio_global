<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1f42"/>
      <stop offset="100%" stop-color="#071125"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c8fff"/>
      <stop offset="100%" stop-color="#5a6fd6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <!-- Subtle cross glow -->
  <rect x="240" y="100" width="32" height="312" rx="16" fill="url(#accent)" opacity="0.08"/>
  <rect x="100" y="240" width="312" height="32" rx="16" fill="url(#accent)" opacity="0.08"/>
  <!-- Small cross icon above text -->
  <rect x="248" y="160" width="16" height="50" rx="3" fill="url(#accent)" opacity="0.5"/>
  <rect x="231" y="176" width="50" height="16" rx="3" fill="url(#accent)" opacity="0.5"/>
  <!-- ORATIO text -->
  <text x="256" y="380" font-family="'Sora','Inter',sans-serif" font-size="108" font-weight="300" fill="#d8ddef" text-anchor="middle" letter-spacing="20">ORATIO</text>
  <!-- Beta badge -->
  <rect x="283" y="398" width="46" height="18" rx="9" fill="rgba(124,143,255,0.12)"/>
  <text x="306" y="411" font-family="sans-serif" font-size="10" fill="#7c8fff" text-anchor="middle" font-weight="600">BETA</text>
</svg>
