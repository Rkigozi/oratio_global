<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1f42"/>
      <stop offset="100%" stop-color="#071125"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c8fff"/>
      <stop offset="100%" stop-color="#5a6fd6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- ORATIO text -->
  <text x="256" y="300" font-family="'Sora','Inter',sans-serif" font-size="120" font-weight="300" fill="#d8ddef" text-anchor="middle" letter-spacing="12">ORATIO</text>
  <!-- Accent line -->
  <rect x="156" y="330" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.3"/>
  <!-- Tagline -->
  <text x="256" y="360" font-family="sans-serif" font-size="14" font-weight="300" fill="#6b7499" text-anchor="middle" letter-spacing="8">PRAY TOGETHER</text>
</svg>
