<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Oratio app icon">
  <defs>
    <linearGradient id="bg" x1="72" y1="56" x2="452" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14295a"/>
      <stop offset="0.58" stop-color="#0a1a3a"/>
      <stop offset="1" stop-color="#060d20"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#7c8fff" stop-opacity="0.3"/>
      <stop offset="0.64" stop-color="#7c8fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7c8fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="wordmark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020817" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="238" r="182" fill="url(#glow)"/>

  <text
    x="256"
    y="278"
    font-family="'Sora','Avenir Next','Inter',sans-serif"
    font-size="88"
    font-weight="300"
    letter-spacing="10"
    fill="#eef2ff"
    text-anchor="middle"
    filter="url(#wordmark-shadow)"
  >ORATIO</text>
</svg>
